# Medium learner-journey dataset (~15M xAPI events, 25k learners) for benchmarks.
# Generate: xapi-db-load journeys --config_file example_configs/journeys_m.yaml
lms_url: http://localhost:18000

journeys:
  seed: 2026
  output_dir: logs/journeys_m
  now: null
  window_days: 330
  running_course_fraction: 0.4
  course_length_days: 120
  num_organizations: 5
  num_actors: 25000
  mbox_actor_fraction: 0.05
  num_actor_profile_changes: 2
  course_publishes: 5
  deleted_unit_course_fraction: 0.1
  sort_events: false
  courses:
    - {template: small, count: 60, runs: [1, 3], learners: [50, 300]}
    - {template: medium, count: 40, runs: [1, 3], learners: [200, 800]}
    - {template: large, count: 15, runs: [1, 2], learners: [300, 1100]}
  course_templates:
    small:
      chapters: [3, 5]
      sequentials_per_chapter: [2, 4]
      verticals_per_sequential: [2, 5]
      problems_per_vertical: [0.5, 0.3, 0.2]
      videos_per_vertical: [0.5, 0.45, 0.05]
      graded_sequential_fraction: 0.3
      video_length: [60, 600]
    medium:
      chapters: [5, 8]
      sequentials_per_chapter: [3, 5]
      verticals_per_sequential: [3, 6]
      problems_per_vertical: [0.4, 0.35, 0.2, 0.05]
      videos_per_vertical: [0.45, 0.5, 0.05]
      graded_sequential_fraction: 0.3
      video_length: [60, 900]
    large:
      chapters: [8, 14]
      sequentials_per_chapter: [3, 6]
      verticals_per_sequential: [3, 8]
      problems_per_vertical: [0.35, 0.35, 0.2, 0.1]
      videos_per_vertical: [0.4, 0.55, 0.05]
      graded_sequential_fraction: 0.3
      video_length: [60, 1200]
  behavior:
    completer_fraction: 0.1
    continue_prob: 0.9
    duplicate_event_prob: 0.001
