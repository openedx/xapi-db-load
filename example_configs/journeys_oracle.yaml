# Small, deterministic learner-journey dataset with every edge case turned on.
# Generate: xapi-db-load journeys --config_file example_configs/journeys_oracle.yaml
# The expected_*.csv.gz files hold the known-correct engagement results.
lms_url: http://localhost:18000

journeys:
  seed: 1335
  output_dir: logs/journeys_oracle
  # Pin "now" so the dataset is identical on every run. Keep it within a day of the time the data
  # is loaded if you want some events inside refreshable-view lookback windows.
  now: null
  window_days: 200
  running_course_fraction: 0.6
  course_length_days: 90
  num_organizations: 2
  num_actors: 60
  mbox_actor_fraction: 0.15
  num_actor_profile_changes: 3
  course_publishes: 3
  deleted_unit_course_fraction: 0.5
  # Order xapi.csv by time across all learners, as live traffic arrives, so watch sessions get
  # split across insert batches when loaded in small blocks.
  sort_events: true
  courses:
    - {template: small, count: 2, runs: [1, 2], learners: [15, 30]}
    - {template: medium, count: 2, runs: [1, 1], learners: [20, 40]}
  course_templates:
    small:
      chapters: [2, 3]
      sequentials_per_chapter: [1, 3]
      verticals_per_sequential: [1, 4]
      problems_per_vertical: [0.5, 0.3, 0.2]
      videos_per_vertical: [0.5, 0.4, 0.1]
      graded_sequential_fraction: 0.3
      video_length: [30, 240]
    medium:
      chapters: [3, 5]
      sequentials_per_chapter: [2, 4]
      verticals_per_sequential: [2, 5]
      problems_per_vertical: [0.4, 0.4, 0.2]
      videos_per_vertical: [0.5, 0.4, 0.1]
      graded_sequential_fraction: 0.3
      video_length: [30, 300]
  behavior:
    completer_fraction: 0.25
    continue_prob: 0.85
    same_time_resume_prob: 0.2
    duplicate_event_prob: 0.02
    recent_activity_fraction: 0.15
